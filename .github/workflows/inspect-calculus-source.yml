name: Inspect calculus layout source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-calculus-source.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract focused layout contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('calculus-tree/index.html').read_text(encoding='utf-8')
          output_dir = Path('.source-inspect/focused')
          output_dir.mkdir(parents=True, exist_ok=True)

          targets = {
              'detail-css.txt': [r'\.detail\s*\{', r'\.detail\.hidden', r'\.detail\.fullscreen', r'\.detail-head', r'\.detail-actions'],
              'detail-layout-js.txt': [r'function\s+syncDetailLayout\s*\(', r'function\s+setDetailFullscreen\s*\(', r'detailBtn\.onclick', r"getElementById\(['\"]detailBtn['\"]\)"],
              'render-flow-js.txt': [r'function\s+renderDetail\s*\(', r'function\s+render\s*\(', r'function\s+select', r'active\s*='],
              'responsive-css.txt': [r'@media\s*\([^)]*max-width', r'@media\s*\([^)]*orientation'],
          }

          for filename, patterns in targets.items():
              parts = [f'length={len(text)}\n']
              for pattern in patterns:
                  matches = list(re.finditer(pattern, text, flags=re.I))
                  parts.append(f'\n===== PATTERN {pattern!r} count={len(matches)} =====\n')
                  for i, match in enumerate(matches[:12], 1):
                      start = max(0, match.start() - 2600)
                      end = min(len(text), match.end() + 5200)
                      parts.append(f'\n--- occurrence {i} at {match.start()} ---\n')
                      parts.append(text[start:end])
                      parts.append('\n')
              (output_dir / filename).write_text(''.join(parts), encoding='utf-8')
          PY

      - name: Commit focused inspection reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source-inspect/focused
          if ! git diff --cached --quiet; then
            git commit -m "chore: add focused calculus layout inspection"
            git push
          fi
