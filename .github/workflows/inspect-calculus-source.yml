name: Inspect calculus layout source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspect-calculus-source.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract relevant source contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('calculus-tree/index.html')
          text = source.read_text(encoding='utf-8')
          terms = [
              '平板适配预备版',
              '全屏讲解',
              '收起',
              '自动聚焦',
              '显示整棵树',
              '返回上一级',
              '同级切换',
              'detail',
              'drawer',
              'panel',
              'sheet',
          ]
          out = []
          out.append(f'length={len(text)}\n')
          for term in terms:
              positions = [m.start() for m in re.finditer(re.escape(term), text, flags=re.I)]
              out.append(f'\n===== TERM {term!r} count={len(positions)} =====\n')
              for n, pos in enumerate(positions[:30], 1):
                  start = max(0, pos - 1800)
                  end = min(len(text), pos + len(term) + 2400)
                  snippet = text[start:end]
                  out.append(f'\n--- occurrence {n} at {pos} ---\n')
                  out.append(snippet)
                  out.append('\n')
          output = Path('.source-inspect/calculus-layout-report.txt')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(''.join(out), encoding='utf-8')
          PY

      - name: Commit inspection report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source-inspect/calculus-layout-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: inspect calculus layout source"
            git push
          fi
