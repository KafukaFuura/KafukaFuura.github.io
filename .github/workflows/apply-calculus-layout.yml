name: Apply calculus layout revision

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-calculus-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate adaptive assets
        shell: bash
        run: |
          node --check calculus-tree/adaptive-detail.js
          test -s calculus-tree/adaptive-detail.css

      - name: Patch the published page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('calculus-tree/index.html')
          text = path.read_text(encoding='utf-8')

          title = '<title>高等数学（上）第二、三章知识树</title>'
          text, title_count = re.subn(
              r'<title>.*?</title>',
              title,
              text,
              count=1,
              flags=re.S | re.I,
          )
          if title_count != 1:
              raise SystemExit(f'Expected one title element, replaced {title_count}.')

          style_tag = '<link rel="stylesheet" href="./adaptive-detail.css?v=20261011-1" />'
          script_tag = '<script src="./adaptive-detail.js?v=20261011-1"></script>'

          text = re.sub(
              r'\s*<link[^>]+href=["\'][^"\']*adaptive-detail\.css[^"\']*["\'][^>]*>\s*',
              '\n',
              text,
              flags=re.I,
          )
          text = re.sub(
              r'\s*<script[^>]+src=["\'][^"\']*adaptive-detail\.js[^"\']*["\'][^>]*>\s*</script>\s*',
              '\n',
              text,
              flags=re.I,
          )

          if '</head>' not in text.lower() or '</body>' not in text.lower():
              raise SystemExit('The page is missing a closing head or body tag.')

          text = re.sub(r'</head>', style_tag + '\n</head>', text, count=1, flags=re.I)
          text = re.sub(r'</body>', script_tag + '\n</body>', text, count=1, flags=re.I)

          required_fragments = [
              title,
              'id="viewport"',
              'id="detail"',
              'id="detailBtn"',
              style_tag,
              script_tag,
          ]
          missing = [fragment for fragment in required_fragments if fragment not in text]
          if missing:
              raise SystemExit(f'Missing required fragments after patch: {missing}')
          if text.count('adaptive-detail.css') != 1 or text.count('adaptive-detail.js') != 1:
              raise SystemExit('Adaptive assets were injected more than once.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time maintenance files
        shell: bash
        run: |
          rm -rf .source-export .source-inspect
          rm -f .github/workflows/export-calculus-source.yml
          rm -f .github/workflows/inspect-calculus-source.yml
          rm -f .github/workflows/apply-calculus-layout.yml

      - name: Commit the revision
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace fixed explanation column with adaptive sheet"
          git push
